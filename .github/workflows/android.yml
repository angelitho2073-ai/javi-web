name: Compilar app Android
on:
  push:
    branches: [sonosticker-android]
    paths-ignore: ['builds/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - name: Preparar llave de firma (si existe)
        env: { KS: '${{ secrets.SONO_KEYSTORE_B64 }}' }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > $RUNNER_TEMP/upload.jks; echo "SONO_KEYSTORE=$RUNNER_TEMP/upload.jks" >> $GITHUB_ENV; fi
      - name: Compilar
        env:
          SONO_STORE_PASS: ${{ secrets.SONO_STORE_PASS }}
          SONO_KEY_ALIAS: ${{ secrets.SONO_KEY_ALIAS }}
          SONO_KEY_PASS: ${{ secrets.SONO_KEY_PASS }}
        run: |
          set -o pipefail
          mkdir -p builds
          gradle --no-daemon assembleDebug bundleRelease 2>&1 | tee builds/build.log
      - name: Guardar resultado en la rama
        if: always()
        run: |
          mkdir -p builds
          cp app/build/outputs/apk/debug/app-debug.apk builds/sonosticker-prueba.apk 2>/dev/null || true
          if [ -n "$SONO_KEYSTORE" ]; then cp app/build/outputs/bundle/release/app-release.aab builds/sonosticker-play.aab 2>/dev/null || true; fi
          tail -c 60000 builds/build.log > builds/build-tail.log || true
          rm -f builds/build.log
          echo "${{ job.status }} $(date -u)" > builds/estado.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add builds
          git commit -m "Compilación de la app [skip ci]" || true
          git push
